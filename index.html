<style>
/* =========================================================
   Design tokens
   Four switchable schemes (html[data-scheme]). Each scheme sets
   colours, type and the photo backdrop; light/dark follow the OS,
   except Midnight which is always dark.
   ========================================================= */

/* ---------- 1. Paper & Mint (default) ---------- */
:root {
  --paper: #ECEBE6;
  --paper-2: #F4F3EF;
  --page-bg: var(--paper);
  --ink: #0E0E0F;
  --ink-2: #34343A;
  --muted: #6B6A66;
  --hair: #C6C3BA;
  --hair-soft: #DAD7CF;
  --hl: #BDEED6;              /* highlighter under numbers */
  --accent: #2FAE7F;
  --on-accent: #0E0E0F;
  --accent-2: #8D72E3;
  --glow-1: #A6EACB;          /* photo backdrop */
  --glow-2: #D2C3F8;
  --focus: #5B45C9;

  /* Metro lines, one per role (text colour on top of each in --on-l*) */
  --l1: #2FAE7F; --on-l1: #0E0E0F;
  --l2: #3E9FD6; --on-l2: #0E0E0F;
  --l3: #8D72E3; --on-l3: #FFFFFF;
  --l4: #0E0E0F; --on-l4: #ECEBE6;
  --l5: #E4724A; --on-l5: #0E0E0F;

  --font: 'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-display: var(--font);
  --font-label: var(--font);
  --display-weight: 600;
  --display-tracking: -.045em;
  --display-transform: none;
  --display-scale: 1;
  --label-tracking: .07em;
  --kpi-weight: var(--display-weight);
  --primary-bg: var(--ink);
  --primary-fg: var(--paper);
  --pop-bg: var(--paper-2);

  --radius: 4px;
  --rail-w: 88px;
  --indent: clamp(0px, 13vw, 190px);
  --stop-rail: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111113; --paper-2: #18181B;
    --ink: #ECEBE6; --ink-2: #C9C8C3; --muted: #8E8D88;
    --hair: #3A3A40; --hair-soft: #27272C;
    --hl: rgba(95, 220, 165, .28);
    --accent: #52D1A0; --on-accent: #111113; --accent-2: #A48DF0;
    --glow-1: rgba(82, 209, 160, .32); --glow-2: rgba(164, 141, 240, .32);
    --focus: #A48DF0;
    --l1: #52D1A0; --on-l1: #111113;
    --l2: #5DB6E8; --on-l2: #111113;
    --l3: #A48DF0; --on-l3: #111113;
    --l4: #ECEBE6; --on-l4: #111113;
    --l5: #F08A64; --on-l5: #111113;
    color-scheme: dark;
  }
}
/* same palette when the viewer explicitly picks dark */
:root[data-theme="dark"] {
  --paper: #111113; --paper-2: #18181B;
  --ink: #ECEBE6; --ink-2: #C9C8C3; --muted: #8E8D88;
  --hair: #3A3A40; --hair-soft: #27272C;
  --hl: rgba(95, 220, 165, .28);
  --accent: #52D1A0; --on-accent: #111113; --accent-2: #A48DF0;
  --glow-1: rgba(82, 209, 160, .32); --glow-2: rgba(164, 141, 240, .32);
  --focus: #A48DF0;
  --l1: #52D1A0; --on-l1: #111113;
  --l2: #5DB6E8; --on-l2: #111113;
  --l3: #A48DF0; --on-l3: #111113;
  --l4: #ECEBE6; --on-l4: #111113;
  --l5: #F08A64; --on-l5: #111113;
  color-scheme: dark;
}

/* ---------- 2. Frost — dusty blue, tan, condensed tracked type ---------- */
:root[data-scheme="frost"] {
  --paper: #E6E9ED; --paper-2: #F2F4F6;
  --page-bg: linear-gradient(180deg, #EEF0F3 0%, #D8DDE2 100%) fixed;

  --l1: #C49A7A; --on-l1: #1B1F24;
  --l2: #8FB3C4; --on-l2: #1B1F24;
  --l3: #4F6D82; --on-l3: #FFFFFF;
  --l4: #1B1F24; --on-l4: #EEF0F3;
  --l5: #B07C84; --on-l5: #FFFFFF;

@media (prefers-color-scheme: dark) {

    --paper: #14181D; --paper-2: #1B2027;

    --l4: #E6EAEE; --on-l4: #14181D;

    color-scheme: dark;

}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background: var(--page-bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
img { display: block; max-width: 100%; height: auto; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 40px; }
section[id] { scroll-margin-top: 24px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.label {
  font: 500 12px/1.4 var(--font-label);
  letter-spacing: var(--label-tracking);
  text-transform: uppercase;
  color: var(--muted);
}
.eyebrow { display: flex; align-items: center; gap: 12px; margin: 0 0 18px; }
.eyebrow::before { content: ''; width: 28px; height: 1px; background: currentColor; opacity: .6; }

/* Mint highlighter under numbers */
.hl {
  background-image: linear-gradient(var(--hl), var(--hl));
  background-repeat: no-repeat;
  background-size: 100% .3em;
  background-position: 0 90%;
  padding: 0 .06em;
  margin: 0 -.06em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}

/* =========================================================
   Left rail (desktop) — the site's own metro line
   ========================================================= */
.rail {
  position: fixed; inset: 0 auto 0 0; z-index: 60; width: var(--rail-w);
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: calc(22px + env(safe-area-inset-top, 0px)) 0 calc(26px + env(safe-area-inset-bottom, 0px));
  border-right: 1px solid var(--hair);
}
.rail__mark {
  width: 40px; height: 40px; border-radius: var(--radius);
  display: grid; place-items: center; flex: none; text-decoration: none;
  background: var(--ink); color: var(--paper); font: 700 13px/1 var(--font); letter-spacing: .02em;
}
.rail__bottom { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.rail__vtext {
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; align-items: center; gap: 14px; white-space: nowrap;
}
.rail__vtext::after { content: ''; width: 1px; height: 48px; background: var(--hair); }

.railnav {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px; border-radius: 999px; background: var(--ink);
}
.railnav__dots { width: 0; height: 16px; border-left: 2px dotted color-mix(in srgb, var(--paper) 45%, transparent); }

.navi {
  position: relative; display: grid; place-items: center;
  width: 42px; height: 42px; border-radius: 50%;
  color: color-mix(in srgb, var(--paper) 70%, transparent);
  transition: background .25s, color .25s;
}
.navi svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.navi:hover { color: var(--paper); }
.navi.is-active { background: var(--accent); color: var(--on-accent); }
.navi__tip {
  position: absolute; left: calc(100% + 18px); top: 50%;
  transform: translate(-6px, -50%); opacity: 0; pointer-events: none;
  padding: 8px 11px; border-radius: var(--radius); white-space: nowrap;
  background: var(--ink); color: var(--paper);
  font: 500 12px/1 var(--font); letter-spacing: .07em; text-transform: uppercase;
  transition: opacity .18s, transform .18s;
}
.navi:hover .navi__tip, .navi:focus-visible .navi__tip { opacity: 1; transform: translate(0, -50%); }

/* Language toggle (horizontal in top bar, vertical in rail) */
.lang {
  position: relative; display: inline-flex; flex: none; padding: 3px;
  border: 1px solid var(--hair); border-radius: var(--radius); background: var(--paper-2);
}
.lang button {
  position: relative; z-index: 1; appearance: none; border: 0; background: none;
  width: 38px; height: 28px; padding: 0; cursor: pointer;
  font: 600 12px/1 var(--font); letter-spacing: .05em; color: var(--muted); transition: color .2s;
}
.lang button[aria-pressed="true"] { color: var(--paper); }
.lang__thumb {
  position: absolute; top: 3px; left: 3px; width: 38px; height: 28px;
  border-radius: 2px; background: var(--ink); transition: transform .3s cubic-bezier(.3, .7, .2, 1);
}
.lang[data-lang="ru"] .lang__thumb { transform: translateX(38px); }
.lang--v { flex-direction: column; }
.lang--v[data-lang="ru"] .lang__thumb { transform: translateY(28px); }

/* Top bar + dock are the mobile counterparts of the rail */
.topbar, .dock { display: none; }

@media (min-width: 900px) {
  body { padding-left: var(--rail-w); }
}
@media (max-height: 640px) {
  .rail__vtext { display: none; }
}

/* Language switch transition */
#app { transition: opacity .18s ease, transform .18s ease, filter .18s ease; }
#app.is-flipping { opacity: 0; transform: translateY(6px); filter: blur(3px); }

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 22px;
  border-radius: var(--radius); border: 1px solid var(--hair);
  background: transparent; color: var(--ink);
  font: 500 16px/1 var(--font); text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: transform .15s, background .15s, border-color .15s;
}
.btn:hover { transform: translateY(-1px); border-color: var(--ink); }
.btn--primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
.btn--outline {
  border: 1.5px solid transparent;
  background:
    linear-gradient(var(--paper), var(--paper)) padding-box,
    linear-gradient(100deg, var(--accent), var(--accent-2)) border-box;
}
.btn--outline:hover { border-color: transparent; }
.link { appearance: none; border: 0; background: none; padding: 0; cursor: pointer; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font: inherit; letter-spacing: inherit; text-transform: inherit; }

/* =========================================================
   Hero
   ========================================================= */
.hero { border-bottom: 1px solid var(--hair); overflow: hidden; }
.hero__bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 30px; }
.hero__bar .eyebrow { margin: 0; }
.hero__grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, .9fr); align-items: end; gap: 24px; }
.hero__text { padding: 56px 0 64px; }
.hero__title {
  margin: 0; font-family: var(--font-display); font-weight: var(--display-weight);
  text-transform: var(--display-transform); letter-spacing: var(--display-tracking);
}
.hero__hello {
  display: block; font-size: calc(clamp(72px, 11vw, 176px) * var(--display-scale)); line-height: .92;
  letter-spacing: calc(var(--display-tracking) - .01em);
}
.hero__name {
  position: relative; display: block; margin-top: 26px; padding-left: var(--indent);
  font-size: calc(clamp(32px, 4.4vw, 64px) * var(--display-scale)); line-height: 1.05; font-weight: 500;
}
/* Hairline connector from "Hello," down to the name, as in the reference */
.hero__name::before {
  content: ''; position: absolute; left: .12em; top: -26px;
  width: calc(var(--indent) - 28px); height: calc(.55em + 26px);
  border-left: 1px solid var(--hair); border-bottom: 1px solid var(--hair);
}
.hero__indent { padding-left: var(--indent); }
.hero__role { margin: 22px 0 0; color: var(--ink); }
.hero__lead { margin: 12px 0 0; max-width: 560px; font-size: clamp(18px, 1.7vw, 21px); line-height: 1.4; color: var(--ink-2); }
.hero__cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

.hero__photo { position: relative; margin: 0; align-self: end; }
.hero__photo img {
  position: relative; z-index: 2; width: 100%; max-width: 500px; margin-left: auto;
  /* the source photo is cropped at the right shoulder — soften that edge */
  -webkit-mask-image: linear-gradient(to left, transparent, #000 9%);
  mask-image: linear-gradient(to left, transparent, #000 9%);
}
.hero__glow {
  position: absolute; z-index: 0; inset: 12% -8% -6% 0;
  background:
    radial-gradient(closest-side at 30% 52%, var(--glow-1), transparent),
    radial-gradient(closest-side at 72% 62%, var(--glow-2), transparent);
  filter: blur(14px);
}
.hero__frame {
  position: absolute; z-index: 1; top: 30%; right: 0; bottom: 0; left: 18%;
  border: 1px solid var(--hair); border-bottom: 0;
}

/* KPI strip */
.report { padding-top: 26px; }
.report__head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.report__head .eyebrow { margin: 0; }
.rag {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 999px;
  background: var(--hl); color: var(--ink);
  font: 600 12px/1 var(--font); letter-spacing: .05em; text-transform: uppercase;
}
.rag i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 2.2s infinite; }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); }
  70% { box-shadow: 0 0 0 8px transparent; }
  100% { box-shadow: 0 0 0 0 transparent; }
}
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--hair); }
.kpi { padding: 30px 28px 30px 0; border-top: 1px solid var(--hair); }
.kpi:not(:nth-child(3n + 1)) { padding-left: 28px; border-left: 1px solid var(--hair); }
.kpi__value { font-family: var(--font-display); font-size: calc(clamp(44px, 5vw, 64px) * var(--display-scale)); font-weight: var(--kpi-weight); letter-spacing: var(--display-tracking); line-height: 1; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.kpi__label { margin-top: 14px; max-width: 24ch; font-size: 14px; line-height: 1.35; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-2); }

/* Photo backdrop per scheme: Paper = soft glow + frame (above); others below */
:root[data-scheme="frost"] .hero__glow {
  inset: 4% 2% auto 8%; aspect-ratio: 1; border-radius: 50%; filter: none;
  background: linear-gradient(160deg, var(--glow-1), var(--glow-2));
}
:root[data-scheme="frost"] .hero__frame { display: none; }
:root[data-scheme="rouge"] .hero__glow {
  inset: 12% 8% 0 14%; border-radius: 999px 999px 0 0; filter: none;
  background: linear-gradient(180deg, var(--glow-1), var(--glow-2));
}
:root[data-scheme="rouge"] .hero__frame { top: 4%; left: 24%; right: 0; border-radius: 999px 999px 0 0; }
:root[data-scheme="midnight"] .hero__frame {
  top: 6%; left: 8%; right: 2%; bottom: auto; aspect-ratio: 1; border-radius: 50%;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
}

/* Bento: tiles with their own local palette (tokens re-scoped per element) */
:root[data-scheme="bento"] .hero__glow { inset: 10% 2% 0 10%; border-radius: 18px 18px 0 0; filter: none; background: var(--glow-1); }
:root[data-scheme="bento"] .hero__frame {
  top: 15%; right: 7%; left: auto; bottom: auto; width: 76px; height: 58px; border: 0;
  background: repeating-linear-gradient(180deg, #FF7A00 0 13px, transparent 13px 22.5px);
}
:root[data-scheme="bento"] .card {
  --paper: #EEF2EF; --paper-2: #EEF2EF; --ink: #0D2B26; --ink-2: #2E4A44; --muted: #5E7470;
  --hair: #C9D3CF; --hair-soft: #D6DEDA; --hl: #DDF7A0;
  color: var(--ink); border-color: transparent;
}
:root[data-scheme="bento"] .card li::before { border-color: color-mix(in srgb, var(--c) 55%, #0D2B26); }
:root[data-scheme="bento"] .linemap {
  --paper-2: #0D2B26; --ink: #F1F3EE; --muted: #9DB5AE; --hair-soft: rgba(255, 255, 255, .14);
  color: var(--ink); border-color: transparent;
}
:root[data-scheme="bento"] .contact { --ink: #0D2B26; --paper: #F1F3EE; }
:root[data-scheme="bento"] .kpis,
:root[data-scheme="meadow"] .kpis { gap: 8px; border: 0; margin-top: 16px; }
:root[data-scheme="bento"] .kpi,
:root[data-scheme="meadow"] .kpi { border: 0 !important; padding: 26px 24px 24px !important; border-radius: var(--radius); }
:root[data-scheme="bento"] .kpi { --hl: transparent; background: var(--tile); color: var(--ink); }
:root[data-scheme="bento"] .kpi:nth-child(6n + 1),
:root[data-scheme="bento"] .kpi:nth-child(6n + 5) { --tile: #DDF7A0; --ink: #0D2B26; --ink-2: #2E4A44; }
:root[data-scheme="bento"] .kpi:nth-child(6n + 2),
:root[data-scheme="bento"] .kpi:nth-child(6n + 6) { --tile: #EEF2EF; --ink: #0D2B26; --ink-2: #2E4A44; }
:root[data-scheme="bento"] .kpi:nth-child(6n + 3) { --tile: #FFB35C; --ink: #1A1206; --ink-2: #3F2A10; }
:root[data-scheme="bento"] .kpi:nth-child(6n + 4) { --tile: #0D2B26; --ink: #F1F3EE; --ink-2: #C3D2CC; }

/* Meadow: frosted-glass surfaces and a segmented green→yellow ring behind the photo */
:root[data-scheme="meadow"] .card,
:root[data-scheme="meadow"] .linemap,
:root[data-scheme="meadow"] .kpi {
  background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .16);
  -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2);
}
:root[data-scheme="meadow"] .lm-stn { background: var(--paper); }
:root[data-scheme="meadow"] .rag { background: var(--accent); color: var(--on-accent); }
:root[data-scheme="meadow"] .contact { --ink: #34502C; --paper: #F3F7EC; }
:root[data-scheme="meadow"] .hero__frame {
  top: 6%; left: 6%; right: 0; bottom: auto; aspect-ratio: 1; border: 0; border-radius: 50%;
  background: conic-gradient(from -20deg,
    #5FB85A 0 22%, transparent 0 23.5%, #9ED36A 0 45%, transparent 0 46.5%,
    #D8E86B 0 68%, transparent 0 69.5%, #EDE98A 0 90%, transparent 0 91.5%, #5FB85A 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px));
}

/* Voltage: electric-blue disc with a neon-yellow satellite */
:root[data-scheme="voltage"] .hero__glow { inset: 8% 4% auto 12%; aspect-ratio: 1; border-radius: 50%; filter: none; background: var(--glow-1); }
:root[data-scheme="voltage"] .hero__frame {
  top: 2%; left: 2%; right: auto; bottom: auto; width: 32%; aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--glow-2);
}

/* Sprint: skewed orange→magenta slab with speed stripes */
:root[data-scheme="sprint"] .hero__glow {
  inset: 14% 4% 0 12%; border-radius: 28px 28px 0 0; filter: none; transform: skewX(-8deg);
  background:
    repeating-linear-gradient(115deg, rgba(255, 255, 255, .16) 0 10px, transparent 10px 28px),
    linear-gradient(135deg, var(--glow-1), var(--glow-2));
}
:root[data-scheme="sprint"] .hero__frame {
  top: 6%; left: 20%; right: -2%; bottom: 0; border: 2px solid var(--accent-2); border-bottom: 0;
  border-radius: 28px 28px 0 0; transform: skewX(-8deg);
}

/* Citrus: a sun with a slowly turning dashed ring */
:root[data-scheme="citrus"] .hero__glow {
  inset: 10% 6% auto 12%; aspect-ratio: 1; border-radius: 50%; filter: none;
  background: radial-gradient(circle at 38% 36%, #FFE77A, var(--glow-1) 70%);
}
:root[data-scheme="citrus"] .hero__frame {
  top: 3%; left: 5%; right: -1%; bottom: auto; aspect-ratio: 1; border-radius: 50%;
  border: 2px dashed var(--accent); animation: spin 60s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Colour scheme picker ---------- */
.scheme { position: relative; }
.scheme__btn {
  display: grid; place-items: center; width: 40px; height: 36px; padding: 0; cursor: pointer;
  border: 1px solid var(--hair); border-radius: var(--radius); background: var(--paper-2); color: var(--ink);
}
.scheme__btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scheme__btn:hover, .scheme.is-open .scheme__btn { border-color: var(--ink); }
.scheme__pop {
  position: absolute; z-index: 80; display: none; width: 300px; padding: 10px; overflow-y: auto;
  background: var(--pop-bg); border: 1px solid var(--hair); border-radius: 8px;
  box-shadow: 0 18px 44px rgba(0, 0, 0, .16);
}
.scheme.is-open .scheme__pop { display: block; }
.rail .scheme__pop { position: fixed; left: calc(var(--rail-w) + 12px); bottom: 16px; max-height: calc(100vh - 32px); }
/* In the mobile top bar the popover anchors to the bar itself, so it never leaves the screen */
.topbar .scheme { position: static; }
.topbar .scheme__pop { right: 12px; top: calc(100% + 8px); width: min(300px, calc(100vw - 24px)); max-height: calc(100vh - 150px); }
.scheme__title { margin: 8px 8px 6px; }
.scheme__title:first-child { margin-top: 2px; }
.scheme__opt {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 7px 10px; margin: 0;
  border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left; color: var(--ink);
}
.scheme__opt:hover { background: var(--hair-soft); }
.scheme__opt[aria-checked="true"] { box-shadow: inset 0 0 0 1.5px var(--ink); }
.sw {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  background: conic-gradient(from 180deg, var(--s2) 0 25%, var(--s3) 0 50%, var(--s1) 0);
  box-shadow: inset 0 0 0 1px rgba(128, 128, 128, .35);
}
.scheme__name { display: block; font-weight: 600; line-height: 1.25; }
.scheme__note { display: block; font-size: 12.5px; line-height: 1.35; color: var(--muted); }

/* =========================================================
   Sections
   ========================================================= */
.section { padding: 96px 0 8px; }
.section__head { max-width: 720px; margin-bottom: 36px; }
.section__title {
  margin: 0; font-family: var(--font-display); font-weight: var(--display-weight);
  font-size: calc(clamp(34px, 4.6vw, 58px) * var(--display-scale)); line-height: 1.04;
  letter-spacing: var(--display-tracking); text-transform: var(--display-transform);
}
.section__lead { color: var(--ink-2); margin: 16px 0 0; font-size: 19px; line-height: 1.45; }

/* ---------- Line map (overview) ---------- */
.linemap {
  background: var(--paper-2); border: 1px solid var(--hair-soft); border-radius: var(--radius);
  padding: 0 36px; margin-bottom: 28px; overflow: hidden;
}
.linemap__inner { position: relative; height: 184px; }
.linemap__track { position: absolute; left: 0; right: 0; top: 124px; height: 8px; border-radius: 8px; background: var(--hair-soft); }
.lm-seg { position: absolute; top: 0; height: 100%; background: var(--c); transition: opacity .25s; }
.lm-seg:first-child { border-radius: 8px 0 0 8px; }
.lm-stn {
  position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; z-index: 1;
  border-radius: 50%; background: var(--paper-2); border: 4px solid var(--c); transition: opacity .25s;
}
.lm-now {
  position: absolute; left: 100%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; z-index: 1;
  border-radius: 50%; background: var(--ink); border: 4px solid var(--paper-2); box-shadow: 0 0 0 2px var(--ink);
}
.lm-label {
  position: absolute; bottom: 68px; margin-left: -1px;
  display: flex; flex-direction: column; gap: 4px;
  padding: 0 10px 0 9px; border-left: 2px solid var(--c);
  text-decoration: none; line-height: 1.15; white-space: nowrap; transition: opacity .25s;
}
.lm-label.t0 { height: 50px; }
.lm-label.t1 { height: 98px; }
.lm-label strong { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.lm-label span { font-size: 11px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.lm-label--end { margin-left: 1px; transform: translateX(-100%); align-items: flex-end; text-align: right; padding: 0 9px 0 10px; border-left: 0; border-right: 2px solid var(--c); }
.lm-l { font-style: normal; }
.lm-label:hover strong { text-decoration: underline; text-underline-offset: 3px; }
.lm-years { position: absolute; left: 0; right: 0; top: 146px; height: 20px; }
.lm-year { position: absolute; transform: translateX(-50%); font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.lm-year--now { left: 100%; transform: translateX(-70%); color: var(--ink); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; }
.linemap .is-dim { opacity: .2; }

/* ---------- Skill filters ---------- */
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.filters__label { margin-right: 6px; }
.chip {
  appearance: none; border: 1px solid var(--hair); background: transparent;
  font: 500 14px/1 var(--font); padding: 10px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.chip:hover { border-color: var(--ink); }
.chip.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters__count { min-height: 18px; margin: 16px 0 44px; }

/* ---------- Stops (vertical line) ---------- */
.stops { position: relative; }
.stop { display: grid; grid-template-columns: var(--stop-rail) minmax(0, 1fr); scroll-margin-top: 24px; }
.stop__rail { position: relative; }
.stop__rail::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--c); }
.stop:last-of-type .stop__rail::before { bottom: auto; height: 38px; }
.stop__dot {
  position: absolute; left: 50%; top: 38px; width: 26px; height: 26px; margin: -13px 0 0 -13px; z-index: 1;
  border-radius: 50%; background: var(--paper); border: 5px solid var(--c);
  transition: background .3s;
}
.stop.is-visited .stop__dot { background: var(--c); }

.card {
  background: var(--paper-2); border: 1px solid var(--hair-soft); border-radius: var(--radius);
  padding: 26px 30px 24px; margin-bottom: 32px; transition: opacity .25s;
}
.stop.is-dim .card { opacity: .42; }
.card__meta { display: flex; flex-wrap: wrap; gap: 4px 0; }
.card__meta span + span::before { content: '·'; margin: 0 10px; }
.card__role { font-family: var(--font-display); font-size: calc(clamp(24px, 2.6vw, 32px) * var(--display-scale)); letter-spacing: var(--display-tracking); line-height: 1.15; font-weight: var(--display-weight); margin: 12px 0 10px; }
.card__company { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 16px; }
.card__company strong { color: var(--ink); font-weight: 600; }
.line-badge {
  display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 6px;
  border-radius: 3px; background: var(--c); color: var(--on-c); font: 700 11px/1 var(--font); letter-spacing: .04em;
}
.card__group { margin-top: 24px; }
.card__group h4 { margin: 0 0 12px; font-weight: 500; }
.card ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 11px; }
.card li { position: relative; padding-left: 26px; border-radius: 3px; color: var(--ink-2); transition: opacity .2s, background .2s, box-shadow .2s; }
.card li::before {
  content: ''; position: absolute; left: 3px; top: 8px; width: 10px; height: 10px;
  border-radius: 50%; border: 2.5px solid var(--c); background: var(--paper-2); transition: background .2s;
}
.card li strong {
  color: var(--ink); font-weight: 600; font-variant-numeric: lining-nums tabular-nums;
  background-image: linear-gradient(var(--hl), var(--hl)); background-repeat: no-repeat;
  background-size: 100% .38em; background-position: 0 88%;
}
.card li.is-dim { opacity: .35; }
.stop.is-dim .card li.is-dim { opacity: 1; }
.card li.is-hit { background: color-mix(in srgb, var(--c) 12%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--c) 12%, transparent); }
.card li.is-hit::before { background: var(--c); }
.card__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--hair-soft); }
.tag {
  appearance: none; border: 1px solid var(--hair-soft); font: 500 13px/1 var(--font); padding: 7px 10px; border-radius: 3px;
  background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s, border-color .15s;
}
.tag:hover { color: var(--ink); border-color: var(--hair); }
.tag.is-on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag--tool { cursor: default; border-style: dashed; }

.terminal { display: grid; grid-template-columns: var(--stop-rail) minmax(0, 1fr); }
.terminal .stop__rail::before { top: 38px; }
.terminal__dot {
  position: absolute; left: 50%; top: 38px; width: 30px; height: 30px; margin: -15px 0 0 -15px; z-index: 1;
  border-radius: 50%; background: var(--ink); border: 6px solid var(--paper); box-shadow: 0 0 0 3px var(--ink);
}
.terminal__body { padding: 26px 0 48px 4px; margin: 0; font-size: 19px; }
.terminal__body strong { font-weight: 600; margin-right: 6px; }
.terminal__body span { color: var(--ink-2); }
.terminal__body a { display: inline-block; margin-left: 6px; font-weight: 600; text-underline-offset: 4px; }

.train {
  position: absolute; left: calc(var(--stop-rail) / 2); top: 0; z-index: 3;
  width: 36px; height: 36px; margin: -18px 0 0 -18px;
  border-radius: var(--radius); background: var(--ink); color: var(--paper);
  display: grid; place-items: center;
  box-shadow: 0 0 0 4px var(--paper);
  will-change: transform;
}

.next {
  position: fixed; left: 50%; bottom: 22px; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px 9px 9px; border-radius: 999px;
  background: var(--ink); color: var(--paper); font-size: 15px; font-weight: 500; white-space: nowrap;
  opacity: 0; transform: translate(-50%, 24px); pointer-events: none;
  transition: opacity .25s, transform .25s;
}
.next.is-on { opacity: 1; transform: translate(-50%, 0); }
.next__k { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; opacity: .6; }
.next .line-badge--now { background: var(--accent); color: var(--on-accent); }
@media (min-width: 900px) {
  .next { left: calc(50% + var(--rail-w) / 2); }
}

/* ---------- Outcomes ---------- */
.outcomes { border-top: 1px solid var(--hair); }
.outcomes__legend { display: flex; gap: 22px; padding: 16px 0; border-bottom: 1px solid var(--hair); }
.outcomes__legend i { display: inline-block; width: 12px; height: 6px; border-radius: 3px; margin-right: 8px; vertical-align: 2px; }
.lg-before { background: var(--hair); }
.lg-after { background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.bar-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) 190px; gap: 32px; align-items: center;
  padding: 24px 0; border-bottom: 1px solid var(--hair);
}
.bar-row__name { font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
.bar-row__ctx { margin-top: 5px; }
.bars { display: grid; gap: 7px; }
.bar { height: 14px; padding-right: 84px; }
.bar span {
  position: relative; display: block; height: 100%; width: 0; border-radius: 7px;
  background: var(--hair); transition: width 1.1s cubic-bezier(.2, .7, .2, 1);
}
.bar--after span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition-delay: .15s; }
.outcomes.is-in .bar span { width: max(4px, var(--w)); }
.bar em { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 500; font-style: normal; color: var(--muted); white-space: nowrap; }
.bar--after em { color: var(--ink); font-weight: 600; }
.bar-row__delta { font-family: var(--font-display); font-size: calc(34px * var(--display-scale)); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); text-align: right; font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }

/* ---------- Contact ---------- */
#contact { padding-bottom: 36px; }
.contact {
  position: relative; overflow: hidden; border-radius: var(--radius);
  background: var(--ink); color: var(--paper); padding: clamp(32px, 6vw, 72px);
}
.contact::before {
  content: ''; position: absolute; right: -10%; top: -30%; width: 60%; height: 140%;
  background:
    radial-gradient(closest-side at 40% 45%, color-mix(in srgb, var(--accent) 45%, transparent), transparent),
    radial-gradient(closest-side at 65% 60%, color-mix(in srgb, var(--accent-2) 45%, transparent), transparent);
  filter: blur(30px); opacity: .55;
}
.contact > :not(svg) { position: relative; z-index: 1; max-width: 660px; }
.contact .label, .contact .section__lead { color: color-mix(in srgb, var(--paper) 62%, transparent); }
.contact__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
.contact__email { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 18px 0 0; }
.contact__addr { color: var(--paper); font-size: 15px; letter-spacing: .01em; text-transform: none; user-select: all; }
.contact .link { color: var(--paper); }
.contact .btn { color: var(--paper); border-color: color-mix(in srgb, var(--paper) 30%, transparent); }
.contact .btn:hover { border-color: var(--paper); }
.contact .btn--primary { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.contact__lines { position: absolute; right: -10px; bottom: -10px; width: 340px; height: 260px; fill: none; stroke-width: 11; stroke-linecap: round; }

.footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding-top: 4px; padding-bottom: 40px; }

   ========================================================= */
@media (max-width: 1100px) {
  .contact__lines { opacity: .3; }
}

@media (max-width: 899px) {
  .rail { display: none; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; height: 60px; padding: 0 16px;

  .topbar__right { display: flex; align-items: center; gap: 8px; flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; font-weight: 600; }
  .brand__name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .dock {
    display: flex; align-items: center;
    position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 45; transform: translateX(-50%);
    padding: 6px; border-radius: 999px; background: var(--ink);
  }
  .dock .railnav__dots { width: 14px; height: 0; border-left: 0; border-top: 2px dotted color-mix(in srgb, var(--paper) 45%, transparent); }
  .dock .navi__tip { display: none; }
  .next { bottom: 80px; }

  section[id], .stop { scroll-margin-top: 72px; }
  body { padding-bottom: 70px; }

  .hero__bar .btn { display: none; }
  .hero__grid { grid-template-columns: 1fr; gap: 0; }
  .hero__text { padding: 36px 0 12px; }
  .hero__name::before { display: none; }
  .hero__photo { max-width: 400px; width: 100%; margin: 0 auto; }
}

@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .kpi, .kpi:not(:nth-child(3n + 1)) { padding: 22px 16px 22px 0; border-left: 0; }
  .kpi:nth-child(even) { padding-left: 16px; border-left: 1px solid var(--hair); }
  .bar-row { grid-template-columns: minmax(0, 1fr) auto; gap: 14px 16px; padding: 20px 0; }
  .bars { grid-column: 1 / -1; grid-row: 2; }
  .bar-row__delta { font-size: 26px; }
}

@media (max-width: 640px) {
  :root { --stop-rail: 44px; --indent: 0px; }
  body { font-size: 16px; }
  .wrap { padding: 0 16px; }
  .hero__bar { padding-top: 22px; }
  .section { padding-top: 72px; }
  .linemap { padding: 0 22px; }
  .linemap__inner { height: 250px; }
  .linemap__track { top: 190px; }
  .lm-years { top: 212px; }
  .lm-label.s0 { height: 48px; }
  .lm-label.s1 { height: 90px; }
  .lm-label.s2 { height: 132px; }

  .lm-l { display: none; }
  .linemap__inner { height: 292px; }
  .linemap__track { top: 232px; }
  .lm-years { top: 254px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; margin: 0 -16px; padding: 2px 16px; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .card { padding: 20px 18px 18px; margin-bottom: 24px; }
  .card__company .card__type { display: none; }
  .stop__dot { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-width: 4px; }
  .train { width: 30px; height: 30px; margin: -15px 0 0 -15px; }
  .next { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* =========================================================
   Print / Save as PDF
   ========================================================= */
@media print {
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: #fff; padding: 0; }
  .rail, .topbar, .dock, .next, .train, .hero__bar .btn, .hero__cta, .filters, .filters__count, .terminal, .contact__actions, .contact__lines { display: none !important; }
  .linemap, .card, .kpi, .bar-row { break-inside: avoid; }
  .section { padding-top: 32px; }
  .stop.is-dim .card, .card li.is-dim { opacity: 1 !important; }
  .card li.is-hit { background: none; box-shadow: none; }
  .outcomes .bar span { width: max(4px, var(--w)) !important; }
  .contact { background: none; color: var(--ink); padding: 0; }
  .contact::before { display: none; }
  .contact .label, .contact .section__lead { color: var(--muted); }
}

<script>

    const q = new URLSearchParams(location.search).get('lang');

    try {
      const saved = localStorage.getItem('cv-lang');
      if (LANGS.includes(saved)) return saved;
    } catch {}
    return (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';

  // ---------- i18n + formatting helpers ----------

  const U = (k) => C.ui[state.lang][k];

  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  const today = new Date();
  const NOW = { y: today.getFullYear(), m: today.getMonth() + 1 };
  const ym = (s) => {
    if (!s) return NOW;
    const [y, m] = s.split('-').map(Number);
    return { y, m };
  };
  const idx = (s) => { const d = ym(s); return d.y * 12 + d.m - 1; };
  const span = (a, b) => idx(b) - idx(a) + 1; // inclusive, like LinkedIn

  const MONTHS = {
    en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],

  const UNITS = {
    en: { year: { one: 'yr', other: 'yrs' }, month: { one: 'mo', other: 'mos' } },

  const fmtYM = (s) => {
    if (!s) return U('present');
    const d = ym(s);
    return `${MONTHS[state.lang][d.m - 1]} ${d.y}`;
  };
  const plural = (n, unit) => {
    const forms = UNITS[state.lang][unit];
    return `${n} ${forms[new Intl.PluralRules(state.lang).select(n)] ?? forms.other}`;

              </h1>
              <div class="hero__indent">
                <p class="hero__role label">${esc(L(P.title))}</p>
                <p class="hero__lead">${esc(L(P.pitch))}</p>
                <div class="hero__cta">
                  <a class="btn btn--primary" href="#route">${U('ctaRoute')} <span aria-hidden="true">↓</span></a>
                </div>
              </div>
            </div>
            <figure class="hero__photo">
              <span class="hero__glow" aria-hidden="true"></span>
              <span class="hero__frame" aria-hidden="true"></span>
              <img src="${esc(P.photo)}" width="554" height="554" alt="${esc(L(P.name))}">
            </figure>
          </div>
        </div>
      </section>
      ${report()}`;
  }

  function report() {
    const years = Math.floor(span(C.person.careerStart, null) / 12);
    const kpis = C.kpis.map((k) => {
      const v = k.value === 'years' ? years : k.value;
      const pre = L(k.prefix) || '', suf = L(k.suffix) || '';
      return `
        <div class="kpi">
          <div class="kpi__value">
            <span class="sr-only">${pre}${nf(v)}${suf}</span>
            <span class="hl" aria-hidden="true">${pre}<span data-count="${v}">${nf(state.kpiDone ? v : 0)}</span>${suf}</span>
          </div>
          <div class="kpi__label">${esc(L(k.label))}</div>
        </div>`;
    }).join('');

    return `
      <section class="report wrap" aria-label="${esc(U('reportTitle'))}">
        <div class="report__head">
          <p class="eyebrow label">${U('reportTitle')} · ${MONTHS[state.lang][NOW.m - 1]} ${NOW.y}</p>
          <span class="rag"><i></i>${U('rag')}</span>
        </div>
        <div class="kpis">${kpis}</div>
      </section>`;
  }

  function linemap() {
    const track = roles.map((r) => {
      const left = pct(r.start), width = (span(r.start, r.end) / TOTAL) * 100;
      return `<span class="lm-seg" data-role="${r.id}" style="${lineVars(r)};left:${left}%;width:${width}%"></span>`;
    }).join('') + roles.map((r) =>
      `<span class="lm-stn" data-role="${r.id}" style="${lineVars(r)};left:${pct(r.start)}%"></span>`
    ).join('');

    // Desktop alternates two tiers; narrow screens use a descending staircase (s0 = lowest)
    // so no label text can cross a later station's leader line.
    // A station close to "now" gets a right-aligned label; on narrow screens it takes the top step
    // so its text runs above every earlier leader line.
    const n = roles.length, endLabel = pct(roles[n - 1].start) > 85;
    const tier = (i) => (endLabel && i >= n - 2 ? (i === n - 1 ? 't1' : 't0') : i % 2 ? 't1' : 't0');
    const step = (i) => (!endLabel ? n - 1 - i : i === n - 1 ? n - 1 : n - 2 - i);
    const labels = roles.map((r, i) => `
      <a class="lm-label ${tier(i)} s${step(i)}${endLabel && i === n - 1 ? ' lm-label--end' : ''}" data-role="${r.id}" href="#stop-${r.id}" style="${lineVars(r)};left:${pct(r.start)}%">
        <strong>${esc(L(r.short))}</strong><span>${ym(r.start).y}<i class="lm-l"> · L${r.line}</i></span>
      </a>`).join('');

    const years = [];
    for (let y = ym(START).y + 1; y <= NOW.y; y++) {
      const p = pct(`${y}-01`);
      if (p < 86) years.push(`<span class="lm-year" style="left:${p}%">${y}</span>`);
    }

    return `
      <div class="linemap" role="img" aria-label="${U('mapLabel')}">
        <div class="linemap__inner">
          ${labels}
          <div class="linemap__track">${track}<span class="lm-now"></span></div>
          <div class="lm-years">${years.join('')}<span class="lm-year lm-year--now">${U('now')}</span></div>
        </div>
      </div>`;
  }

  function stopCard(r) {
    const meta = [`${fmtYM(r.start)} — ${fmtYM(r.end)}`, fmtDur(span(r.start, r.end)), L(r.location)]
      .filter(Boolean).map((s) => `<span>${esc(s)}</span>`).join('');
    const company = `<strong>${esc(L(r.company))}</strong>${r.type ? `<span class="card__type"><span aria-hidden="true">· </span>${esc(L(r.type))}</span>` : ''}`;
    const groups = r.groups.map((g) => `
      <div class="card__group">
        ${g.title ? `<h4 class="label">${U(g.title)}</h4>` : ''}
        <ul>${g.items.map((it) => `<li data-tags="${it.tags.join(' ')}">${md(L(it.text))}</li>`).join('')}</ul>
      </div>`).join('');
    const tags = r.tags.map((id) => `<button type="button" class="tag" data-skill="${id}">${esc(skillLabel(id))}</button>`).join('')
      + (r.tools || []).map((t) => `<span class="tag tag--tool">${esc(L(t))}</span>`).join('');

    return `
      <article class="stop" id="stop-${r.id}" data-role="${r.id}" data-tags="${r.tags.join(' ')}" style="${lineVars(r)}">
        <div class="stop__rail"><span class="stop__dot"></span></div>
        <div class="card">
          <div class="card__meta label">${meta}</div>
          <h3 class="card__role">${esc(L(r.role))}</h3>
          <div class="card__company"><span class="line-badge" title="${U('line')} ${r.line}">L${r.line}</span>${company}</div>
          ${groups}
          <div class="card__tags">${tags}</div>
        </div>
      </article>`;
  }

  function route() {
    const last = roles[roles.length - 1];
    const chips = C.skills.map((s) =>
      `<button type="button" class="chip" data-skill="${s.id}" aria-pressed="false">${esc(L(s.label))}</button>`
    ).join('');

    return `
      <section class="section" id="route">
        <div class="wrap">
          <div class="section__head">
            <p class="eyebrow label">${U('routeKicker')}</p>
            <h2 class="section__title">${U('routeTitle')}</h2>
            <p class="section__lead">${U('routeLead')}</p>
          </div>
          ${linemap()}
          <div class="filters" role="group" aria-label="${U('filterLabel')}">
            <span class="filters__label label">${U('filterLabel')}</span>${chips}
          </div>
          <p class="filters__count label" aria-live="polite"></p>
          <div class="stops">
            <div class="train" aria-hidden="true">${TRAIN_SVG}</div>
            <div class="terminal" style="${lineVars(last)}">
              <div class="stop__rail"><span class="terminal__dot"></span></div>
              <p class="terminal__body"><strong>${U('terminalTitle')}</strong><span>${U('terminalText')}</span> <a href="#contact">${U('terminalCta')} →</a></p>
            </div>
            ${[...roles].reverse().map(stopCard).join('')}
          </div>
        </div>
      </section>`;
  }

  function outcomes() {
    const rows = C.outcomes.map((m) => {
      const max = m.max ?? Math.max(m.before, m.after);
      const w = (v) => `${((v / max) * 100).toFixed(1)}%`;
      const label = (v, l) => esc(l ? L(l) : nf(v));
      return `
        <div class="bar-row">
          <div>
            <div class="bar-row__name">${esc(L(m.label))}</div>
            <div class="bar-row__ctx label">${esc(L(m.context))} · ${U(m.lowerBetter ? 'lowerBetter' : 'higherBetter')}</div>
          </div>
          <div class="bars">
            <div class="bar bar--before"><span style="--w:${w(m.before)}"><em>${label(m.before, m.beforeLabel)}</em></span></div>
            <div class="bar bar--after"><span style="--w:${w(m.after)}"><em>${label(m.after, m.afterLabel)}</em></span></div>
          </div>
          <div class="bar-row__delta"><span class="hl">${esc(L(m.delta))}</span></div>
        </div>`;
    }).join('');

    return `
      <section class="section" id="outcomes">
        <div class="wrap">
          <div class="section__head">
            <p class="eyebrow label">${U('outcomesKicker')}</p>
            <h2 class="section__title">${U('outcomesTitle')}</h2>
            <p class="section__lead">${U('outcomesLead')}</p>
          </div>
          <div class="outcomes${state.outcomesDone ? ' is-in' : ''}">
            <div class="outcomes__legend label"><span><i class="lg-before"></i>${U('before')}</span><span><i class="lg-after"></i>${U('after')}</span></div>
            ${rows}
          </div>
        </div>
      </section>`;
  }

  function contact() {
    const P = C.person;
    return `
      <section class="section" id="contact">
        <div class="wrap">
          <div class="contact">
            ${LINES_SVG}
            <p class="eyebrow label">${U('contactKicker')}</p>
            <h2 class="section__title">${U('contactTitle')}</h2>
            <p class="section__lead">${U('contactLead')}</p>
            <div class="contact__actions">
              <a class="btn btn--primary" href="mailto:${esc(P.email)}">${U('email')} <span aria-hidden="true">→</span></a>
              <a class="btn" href="${esc(P.telegram)}" target="_blank" rel="noopener">Telegram ↗</a>
              <a class="btn" href="${esc(P.habr)}" target="_blank" rel="noopener">Habr ↗</a>
              ${IS_ARTIFACT ? '' : `<button class="btn" type="button" data-print>${U('print')}</button>`}
            </div>
            <p class="contact__email label">
              <span class="contact__addr">${esc(P.email)}</span>
              <button type="button" class="link" data-copy="${esc(P.email)}">${U('copy')}</button>
            </p>
          </div>
        </div>
      </section>
      <footer class="footer wrap label"><span>© ${NOW.y} ${esc(L(P.name))}</span><span>${U('footer')}</span></footer>`;
  }

  // ---------- Behaviour ----------
  function applyFilter() {
    const s = state.skill;
    $$('#app [data-skill]').forEach((b) => {
      const on = b.dataset.skill === s;
      b.classList.toggle('is-on', on);
      if (b.classList.contains('chip')) b.setAttribute('aria-pressed', on);
    });

    let hits = 0;
    $$('.stop').forEach((stop) => {
      const hit = !s || stop.dataset.tags.split(' ').includes(s);
      if (s && hit) hits++;
      stop.classList.toggle('is-dim', !hit);
      $$('li[data-tags]', stop).forEach((li) => {
        const m = !!s && li.dataset.tags.split(' ').includes(s);
        li.classList.toggle('is-hit', m);
        li.classList.toggle('is-dim', !!s && !m);
      });
      $$(`.linemap [data-role="${stop.dataset.role}"]`).forEach((el) => el.classList.toggle('is-dim', !hit));
    });

    $('.filters__count').innerHTML = s
      ? `${fill(U('filterCount'), { n: hits, total: roles.length })} · <button type="button" class="link" data-clear>${U('filterClear')}</button>`
      : U('filterHint');
  }

  function countUp() {
    const els = $$('.kpi [data-count]');
    const t0 = performance.now(), D = 1400;
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
      els.forEach((el) => { el.textContent = nf(Math.round(+el.dataset.count * e)); });
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  function observeOnce(el, fn) {
    if (!el) return;
    const io = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) { io.disconnect(); fn(el); }
    }, { threshold: 0.25 });
    io.observe(el);
    observers.push(io);
  }

  // Train position: measured relative to .stops
  function measure() {
    const stops = $('.stops');
    if (!stops) return (geo = null);
    const top = stops.getBoundingClientRect().top;
    const centerY = (el) => { const r = el.getBoundingClientRect(); return r.top + r.height / 2 - top; };
    geo = {
      stops,
      train: $('.train', stops),
      points: $$('.stop', stops).map((el) => ({
        el, y: centerY($('.stop__dot', el)), role: roles.find((r) => r.id === el.dataset.role),
      })),
      start: centerY($('.terminal__dot', stops)),
    };
    geo.end = geo.points[geo.points.length - 1].y;
  }

  // Highlight the navigation station for the section in view
  function spy() {
    const atBottom = innerHeight + scrollY >= document.documentElement.scrollHeight - 4;
    let active = SECTIONS[0].id;
    if (atBottom) active = SECTIONS[SECTIONS.length - 1].id;
    else SECTIONS.forEach((s) => {
      const el = document.getElementById(s.id);
      if (el && el.getBoundingClientRect().top <= innerHeight * 0.35) active = s.id;
    });
    if (active === state.active) return;
    state.active = active;
    $$('[data-nav]').forEach((a) => {
      const on = a.dataset.nav === active;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current');
    });
  }

  function onScroll() {
    spy();
    if (!geo) return;
    const r = geo.stops.getBoundingClientRect();
    const y = Math.max(geo.start, Math.min(geo.end, innerHeight * 0.42 - r.top));
    geo.train.style.transform = `translateY(${y}px)`;

    let next = null;
    geo.points.forEach((p) => {
      const visited = p.y <= y + 1;
      p.el.classList.toggle('is-visited', visited);
      if (!visited && !next) next = p;
    });
    updateNext(r.top < innerHeight * 0.6 && r.bottom > innerHeight * 0.55, next);
  }

  function updateNext(show, p) {
    const el = $('#next');
    el.classList.toggle('is-on', show);
    const key = `${p ? p.role.id : 'end'}:${state.lang}`;
    if (el.dataset.key === key) return;
    el.dataset.key = key;
    el.innerHTML = p
      ? `<span class="line-badge" style="${lineVars(p.role)}">L${p.role.line}</span>
         <span class="next__k">${U('nextStation')}</span><span>${esc(L(p.role.short))} · ${ym(p.role.start).y}</span>`
      : `<span class="line-badge" style="${lineVars(roles[0])}">L${roles[0].line}</span>
         <span class="next__k">${U('terminal')}</span><span>${esc(L(roles[0].short))} · ${ym(roles[0].start).y}</span>`;
  }

  let ticking = false;
  const requestUpdate = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; onScroll(); });
  };

  // ---------- Render ----------
  function render() {
    document.documentElement.lang = state.lang;
    document.title = `${L(C.person.name)} — ${L(C.person.title)}`;
    const meta = $('meta[name="description"]');
    if (meta) meta.content = L(C.person.pitch);
    updateChrome();

    $('#app').innerHTML = hero() + route() + outcomes() + contact();

    observers.forEach((o) => o.disconnect());
    observers = [];
    if (!state.kpiDone) observeOnce($('.kpis'), () => { state.kpiDone = true; countUp(); });
    if (!state.outcomesDone) observeOnce($('.outcomes'), (el) => { state.outcomesDone = true; el.classList.add('is-in'); });

    state.active = null;
    applyFilter();
    measure();
    onScroll();
  }

  function setLang(lang) {
    if (lang === state.lang || !LANGS.includes(lang)) return;
    state.lang = lang;
    try { localStorage.setItem('cv-lang', lang); } catch {}
    try {
      const url = new URL(location.href);
      url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
    } catch {}

    updateChrome();
    if (reduceMotion) return render();
    const app = $('#app');
    app.classList.add('is-flipping');
    setTimeout(() => {
      render();
      requestAnimationFrame(() => app.classList.remove('is-flipping'));
    }, 180);
  }

  function init() {
    const saved = document.documentElement.dataset.scheme;
    setScheme(SCHEME_IDS.includes(saved) ? saved : SCHEME_IDS[0]);
    renderChrome();
    render();

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('.scheme__btn');
      const opt = e.target.closest('.scheme__opt');
      if (btn) {
        const box = btn.parentElement, open = !box.classList.contains('is-open');
        closePickers(box);
        box.classList.toggle('is-open', open);
        btn.setAttribute('aria-expanded', open);
      } else if (opt) {
        setScheme(opt.dataset.scheme);
      } else if (!e.target.closest('.scheme__pop')) {
        closePickers();
      }
    });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePickers(); });

    $('#app').addEventListener('click', (e) => {
      const skill = e.target.closest('[data-skill]');
      if (skill) {
        state.skill = state.skill === skill.dataset.skill ? null : skill.dataset.skill;
        applyFilter();
        return;
      }
      if (e.target.closest('[data-clear]')) { state.skill = null; applyFilter(); return; }
      const copy = e.target.closest('[data-copy]');
      if (copy) {
        const selectAddr = () => {
          const range = document.createRange();
          range.selectNodeContents(copy.previousElementSibling);
          const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
        };
        const done = () => { copy.textContent = U('copied'); setTimeout(() => { copy.textContent = U('copy'); }, 1600); };
        try { navigator.clipboard.writeText(copy.dataset.copy).then(done, selectAddr); } catch { selectAddr(); }
        return;
      }
      if (e.target.closest('[data-print]')) window.print();
    });

    addEventListener('scroll', requestUpdate, { passive: true });
    addEventListener('resize', () => { measure(); requestUpdate(); });
    new ResizeObserver(() => { measure(); requestUpdate(); }).observe($('#app'));
    document.fonts?.ready.then(() => { measure(); onScroll(); });

    addEventListener('beforeprint', () => {
      state.kpiDone = state.outcomesDone = true;
      $$('.kpi [data-count]').forEach((el) => { el.textContent = nf(+el.dataset.count); });
      $('.outcomes')?.classList.add('is-in');
    });

    // Content is rendered by JS, so honour deep links manually
    if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
  }

  init();
})();

</script>

</body></html>
